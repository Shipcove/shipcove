# Configuration du LiteLLM fourni. Les modèles se déclarent dans LiteLLM (interface /ui, API
# /model/new ou model_list ci-dessous) ; la plateforme les découvre via /model/info.
# Un proxy LiteLLM existant peut le remplacer : Administration → Modèles → Connexion à LiteLLM.
general_settings:
  store_model_in_db: true
  disable_spend_logs: false
litellm_settings:
  drop_params: true
  request_timeout: 600
  num_retries: 0          # les retries sont contrôlés par Pi / la gateway (pas de rejeu aveugle)
  telemetry: false
