# Déploiement officiel Docker Compose (non haute disponibilité).
# Prérequis : ./scripts/init-secrets.sh (génère .secrets/). Voir docs/operations/docker-compose.md.
name: cap

x-app-env: &app-env
  NODE_ENV: ${CAP_NODE_ENV:-production}
  LOG_FORMAT: json
  VAULT_ADDR: http://vault:8200
  VAULT_AUTH_METHOD: approle
  S3_ENDPOINT: http://garage:3900
  S3_REGION: garage
  LITELLM_URL: http://litellm:4000
  PUBLIC_URL: ${CAP_PUBLIC_URL:-http://localhost:8080}
  PREVIEW_DOMAIN: ${CAP_PREVIEW_DOMAIN:-preview.localhost}
  PREVIEW_PUBLIC_SCHEME: ${CAP_PREVIEW_SCHEME:-http}
  PREVIEW_PUBLIC_PORT: ${CAP_PREVIEW_PORT:-8090}

services:
  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: cap
    secrets: [postgres_password]
    volumes:
      - pg-data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports: ["127.0.0.1:${CAP_PG_PORT:-5432}:5432"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cap -d cap"]
      interval: 5s
      timeout: 3s
      retries: 30

  vault:
    image: hashicorp/vault:2.2.2
    restart: unless-stopped
    command: ["server"]
    cap_add: [IPC_LOCK]
    # Déverrouillage par un service de clés (mode auto) : stanza `seal` dans vault/seal.hcl,
    # identifiants éventuels du fournisseur dans vault/seal.env (docs/operations/vault.md).
    env_file:
      - path: ./vault/seal.env
        required: false
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./vault:/vault/config:ro
      - vault-data:/vault/file
      - vault-logs:/vault/logs
    ports: ["127.0.0.1:${CAP_VAULT_PORT:-8200}:8200"]
    networks: [backend]
    healthcheck:
      # 200 actif, 429 standby, 501 non initialisé, 503 scellé : le conteneur est vivant.
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8200/v1/sys/health?uninitcode=200&sealedcode=200&standbyok=true' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    secrets: [garage_rpc_secret, garage_admin_token, garage_metrics_token]
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports: ["127.0.0.1:${CAP_S3_PORT:-3900}:3900"]
    networks: [backend]

  bootstrap:
    image: node:26-bookworm-slim
    restart: "no"
    command: ["node", "/bootstrap/bootstrap.mjs"]
    environment:
      VAULT_ADDR: http://vault:8200
      GARAGE_ADMIN_URL: http://garage:3903
      SECRETS_DIR: /secrets
      VAULT_UNSEAL_MODE: ${CAP_VAULT_UNSEAL_MODE:-file}
      # Modes manual / auto : jeton d'administration fourni ponctuellement (mise à jour des politiques).
      VAULT_TOKEN: ${VAULT_TOKEN:-}
    volumes:
      - ./bootstrap:/bootstrap:ro
      - ./.secrets:/secrets
    networks: [backend]
    depends_on:
      vault: { condition: service_healthy }
      garage: { condition: service_started }

  vault-unsealer:
    image: node:26-bookworm-slim
    restart: unless-stopped
    command: ["node", "/bootstrap/bootstrap.mjs"]
    environment:
      VAULT_ADDR: http://vault:8200
      GARAGE_ADMIN_URL: http://garage:3903
      SECRETS_DIR: /secrets
      VAULT_UNSEAL_MODE: ${CAP_VAULT_UNSEAL_MODE:-file}
      WATCH_UNSEAL: "1"
    volumes:
      - ./bootstrap:/bootstrap:ro
      - ./.secrets:/secrets
    networks: [backend]
    depends_on:
      bootstrap: { condition: service_completed_successfully }

  litellm:
    image: ghcr.io/berriai/litellm:v1.109.1
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: [./.secrets/litellm.env]
    environment:
      STORE_MODEL_IN_DB: "True"
      # Interface d'administration de LiteLLM inutile (la plateforme passe par l'API) : désactivée.
      DISABLE_ADMIN_UI: "True"
      LITELLM_LOG: ERROR
      NO_DOCS: "True"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports: ["127.0.0.1:${CAP_LITELLM_PORT:-4000}:4000"]
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # SMTP de développement / recette (désactivable). En production, configurer un SMTP réel dans l'admin.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    profiles: ["dev"]
    ports: ["127.0.0.1:${CAP_MAILPIT_UI_PORT:-8025}:8025", "127.0.0.1:${CAP_SMTP_PORT:-1025}:1025"]
    networks: [backend]

  # Fournisseur LLM factice pour la recette et les tests e2e (jamais en production).
  mock-llm:
    image: node:26-bookworm-slim
    restart: unless-stopped
    profiles: ["dev"]
    command: ["node", "/app/server.mjs"]
    volumes:
      - ../../tools/mock-llm/server.mjs:/app/server.mjs:ro
    networks: [backend]

  # ----------------------------- Applications -----------------------------
  migrate:
    image: ${CAP_REGISTRY:-}shipcove-api:${CAP_VERSION:-0.1.0}
    restart: "no"
    command: ["node", "node_modules/@cap/database/dist/migrate-cli.js"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url_api
    secrets: [database_url_api]
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: ${CAP_REGISTRY:-}shipcove-api:${CAP_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      <<: *app-env
      DATABASE_URL_FILE: /run/secrets/database_url_api
      VAULT_ROLE_ID_FILE: /secrets/approle/api/role_id
      VAULT_SECRET_ID_FILE: /secrets/approle/api/secret_id
      COOKIE_SECURE: ${CAP_COOKIE_SECURE:-false}
      # Seuls les proxys de la plateforme (web, et edge avec le profil « tls ») fixent l'adresse IP du
      # client ; un autre conteneur du réseau interne ne peut pas l'usurper.
      TRUST_PROXY: ${CAP_TRUST_PROXY:-loopback, web, edge}
      BOOTSTRAP_ADMIN_EMAIL: ${CAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${CAP_ADMIN_PASSWORD:-}
    secrets: [database_url_api]
    volumes:
      - ./.secrets/approle/api:/secrets/approle/api:ro
    networks: [backend]
    deploy:
      replicas: ${CAP_API_REPLICAS:-2}
    depends_on:
      migrate: { condition: service_completed_successfully }
      bootstrap: { condition: service_completed_successfully }

  worker:
    image: ${CAP_REGISTRY:-}shipcove-worker:${CAP_VERSION:-0.1.0}
    restart: unless-stopped
    # Aucun accès direct au socket Docker : les sandboxes sont créées via le garde (ADR 0014).
    environment:
      <<: *app-env
      DATABASE_URL_FILE: /run/secrets/database_url_worker
      VAULT_ROLE_ID_FILE: /secrets/approle/worker/role_id
      VAULT_SECRET_ID_FILE: /secrets/approle/worker/secret_id
      SANDBOX_PROVIDER: docker
      SANDBOX_NETWORK: cap-sandbox
      # Un réseau privé par sandbox (sous-réseaux /28 de cette plage) : aucune sandbox ne peut en
      # joindre une autre. Vide : ancien réseau partagé cap-sandbox.
      SANDBOX_SUBNET_POOL: ${CAP_SANDBOX_SUBNET_POOL-10.231.0.0/16}
      SANDBOX_IMAGE: ${CAP_SANDBOX_IMAGE:-shipcove-sandbox:0.1.0}
      GATEWAY_INTERNAL_URL: http://gateway:8081
      EGRESS_PROXY_URL: http://gateway:3128
      DOCKER_GUARD_URL: http://docker-guard:2375
      DOCKER_GUARD_TOKEN_FILE: /run/secrets/docker_guard_token
    secrets: [database_url_worker, docker_guard_token]
    volumes:
      - ./.secrets/approle/worker:/secrets/approle/worker:ro
    networks: [backend, dockerctl]
    depends_on:
      migrate: { condition: service_completed_successfully }
      bootstrap: { condition: service_completed_successfully }
      docker-guard: { condition: service_healthy }

  # Seul détenteur du socket Docker : n'autorise que les opérations du modèle des sandboxes
  # (conteneurs durcis étiquetés cap.*), jamais de conteneur privilégié ni de montage de l'hôte.
  docker-guard:
    image: ${CAP_REGISTRY:-}shipcove-docker-guard:${CAP_VERSION:-0.1.0}
    restart: unless-stopped
    group_add: ["${CAP_DOCKER_GID:-999}"]
    environment:
      GUARD_TOKEN_FILE: /run/secrets/docker_guard_token
      SANDBOX_NETWORK: cap-sandbox
      SANDBOX_SUBNET_POOL: ${CAP_SANDBOX_SUBNET_POOL-10.231.0.0/16}
      GUARD_ALLOWED_RUNTIMES: ${CAP_SANDBOX_RUNTIMES:-}
      # Préfixes d'images autorisés au téléchargement, séparés par des virgules (vide : tous).
      GUARD_PULL_ALLOWLIST: ${CAP_GUARD_PULL_ALLOWLIST:-}
    secrets: [docker_guard_token]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [dockerctl]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  gateway:
    image: ${CAP_REGISTRY:-}shipcove-gateway:${CAP_VERSION:-0.1.0}
    # Branché par la garde Docker sur le réseau privé de chaque sandbox (alias DNS « gateway »).
    labels:
      cap.sandbox-peer: gateway
    restart: unless-stopped
    environment:
      <<: *app-env
      DATABASE_URL_FILE: /run/secrets/database_url_gateway
      VAULT_ROLE_ID_FILE: /secrets/approle/gateway/role_id
      VAULT_SECRET_ID_FILE: /secrets/approle/gateway/secret_id
    secrets: [database_url_gateway]
    volumes:
      - ./.secrets/approle/gateway:/secrets/approle/gateway:ro
    # Seul service (avec preview) attaché au réseau des sandboxes.
    networks: [backend, sandbox]
    depends_on:
      migrate: { condition: service_completed_successfully }
      bootstrap: { condition: service_completed_successfully }

  preview:
    image: ${CAP_REGISTRY:-}shipcove-preview:${CAP_VERSION:-0.1.0}
    # Branché par la garde Docker sur le réseau privé de chaque sandbox (alias DNS « preview »).
    labels:
      cap.sandbox-peer: preview
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: "8090"
      DATABASE_URL_FILE: /run/secrets/database_url_gateway
      VAULT_ROLE_ID_FILE: /secrets/approle/preview/role_id
      VAULT_SECRET_ID_FILE: /secrets/approle/preview/secret_id
    secrets: [database_url_gateway]
    volumes:
      - ./.secrets/approle/preview:/secrets/approle/preview:ro
    ports: ["${CAP_PREVIEW_BIND:-127.0.0.1}:${CAP_PREVIEW_PORT:-8090}:8090"]
    networks: [backend, sandbox]
    depends_on:
      bootstrap: { condition: service_completed_successfully }

  web:
    image: ${CAP_REGISTRY:-}shipcove-web:${CAP_VERSION:-0.1.0}
    restart: unless-stopped
    ports: ["${CAP_HTTP_BIND:-127.0.0.1}:${CAP_HTTP_PORT:-8080}:8080"]
    networks: [backend]
    depends_on: [api]

  # Point d'entrée TLS optionnel (profil « tls ») : Caddy, certificats automatiques.
  edge:
    image: caddy:2.10.2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      CAP_DOMAIN: ${CAP_DOMAIN:-}
      CAP_PREVIEW_DOMAIN: ${CAP_PREVIEW_DOMAIN:-preview.localhost}
      CAP_TLS_EMAIL: ${CAP_TLS_EMAIL:-}
      CAP_TLS_PREVIEW: ${CAP_TLS_PREVIEW:-on-demand}
      CAP_TLS_ISSUER: ${CAP_TLS_ISSUER:-acme}
    ports:
      - "${CAP_TLS_BIND:-0.0.0.0}:${CAP_TLS_HTTP_PORT:-80}:80"
      - "${CAP_TLS_BIND:-0.0.0.0}:${CAP_TLS_HTTPS_PORT:-443}:443"
      - "${CAP_TLS_BIND:-0.0.0.0}:${CAP_TLS_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./edge:/etc/caddy:ro
      - edge-data:/data
      - edge-config:/config
    networks: [backend]
    depends_on: [web, preview]

secrets:
  postgres_password: { file: ./.secrets/postgres_password }
  garage_rpc_secret: { file: ./.secrets/garage_rpc_secret }
  garage_admin_token: { file: ./.secrets/garage_admin_token }
  garage_metrics_token: { file: ./.secrets/garage_metrics_token }
  database_url_api: { file: ./.secrets/database_url_api }
  database_url_worker: { file: ./.secrets/database_url_worker }
  database_url_gateway: { file: ./.secrets/database_url_gateway }
  docker_guard_token: { file: ./.secrets/docker_guard_token }

networks:
  backend: {}
  # Canal worker → garde Docker uniquement.
  dockerctl:
    internal: true
  # Réseau des sandboxes : AUCUNE route vers l'extérieur ni vers le backend.
  sandbox:
    name: cap-sandbox
    internal: true

volumes:
  edge-data: {}
  edge-config: {}
  pg-data: {}
  vault-data: {}
  vault-logs: {}
  garage-meta: {}
  garage-data: {}
