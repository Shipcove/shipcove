# Infrastructure de DÉVELOPPEMENT (services de support uniquement ; les apps tournent via pnpm).
# Ne pas utiliser en production : voir compose.yml.
name: cap-dev
services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: cap
      POSTGRES_PASSWORD: cap
      POSTGRES_DB: cap
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql
      - ./postgres/init-dev.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cap -d cap"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pg-data:
