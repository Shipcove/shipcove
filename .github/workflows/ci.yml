# Images Docker publiées sur le registre GitHub (ghcr.io/shipcove/shipcove-*), UNIQUEMENT à la
# création d'un tag de version : `git tag v1.2.3 && git push origin v1.2.3`.
#  - tag vX.Y.Z : images X.Y.Z, X.Y et latest ;
#  - tag de pré-version vX.Y.Z-rc.N : image X.Y.Z-rc.N seulement.
# Aucune image n'est construite pour les pushes de branche ni pour les pull requests. Relance
# manuelle possible (workflow_dispatch) en choisissant un tag, jamais une branche.
name: Images

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/shipcove

jobs:
  images:
    name: Image ${{ matrix.image }}
    # Relance manuelle : seulement depuis un tag de version.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: api, context: ., file: infrastructure/docker/Dockerfile.node, target: api }
          - { image: worker, context: ., file: infrastructure/docker/Dockerfile.node, target: worker }
          - { image: gateway, context: ., file: infrastructure/docker/Dockerfile.node, target: gateway }
          - { image: preview, context: ., file: infrastructure/docker/Dockerfile.node, target: preview }
          - { image: docker-guard, context: ., file: infrastructure/docker/Dockerfile.node, target: docker-guard }
          - { image: web, context: ., file: infrastructure/docker/Dockerfile.web, target: '' }
          - { image: sandbox, context: packages/sandbox-image, file: packages/sandbox-image/Dockerfile, target: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Étiquettes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/shipcove-${{ matrix.image }}
          # `latest` est ajouté automatiquement pour un tag de version (hors pré-version).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=shipcove-${{ matrix.image }}
            org.opencontainers.image.vendor=Shipcove
      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
