# Nginx de l'application : fichiers statiques Angular + proxy de l'API (plusieurs instances possibles).
# Répliques API résolues à chaque requête (DNS interne de Docker, cache 5 s) : une instance
# redémarrée ou recréée change d'adresse IP. Un bloc `upstream` figerait les adresses lues au
# démarrage ; avec `server … resolve`, la bascule vers une autre réplique ne se faisait pas
# (vérifié par tests/e2e/resilience.test.mjs). Le `proxy_pass` à variable répartit et bascule
# entre toutes les adresses résolues (au prix des connexions persistantes vers l'amont).
resolver 127.0.0.11 valid=5s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 100m;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Monaco nécessite blob: pour ses workers ; aucun script tiers.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Flux SSE : pas de mise en tampon, connexions longues.
    location ~ ^/api/v1/workspaces/[^/]+/events$ {
        set $cap_api_backend http://api:3000;
        proxy_pass $cap_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        # Bascule rapide vers une autre réplique si une instance vient de disparaître (connexion
        # interne instantanée en temps normal). Une requête non idempotente n'est rejouée que si
        # elle n'a pas été transmise (échec de connexion), jamais après envoi.
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_read_timeout 24h;
        chunked_transfer_encoding on;
        # En-têtes de sécurité déjà posés ici (niveau serveur) : les doublons de l'API (helmet) sont
        # masqués pour éviter des valeurs multiples ou contradictoires. Le CSP de l'API est conservé
        # (ex. `sandbox` des pièces jointes) : le navigateur applique l'intersection des politiques.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    location /api/ {
        set $cap_api_backend http://api:3000;
        proxy_pass $cap_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        # Bascule rapide vers une autre réplique si une instance vient de disparaître (connexion
        # interne instantanée en temps normal). Une requête non idempotente n'est rejouée que si
        # elle n'a pas été transmise (échec de connexion), jamais après envoi.
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
        # En-têtes de sécurité déjà posés ici (niveau serveur) : les doublons de l'API (helmet) sont
        # masqués pour éviter des valeurs multiples ou contradictoires. Le CSP de l'API est conservé
        # (ex. `sandbox` des pièces jointes) : le navigateur applique l'intersection des politiques.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    location /monaco/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        location ~* \.(js|css|woff2?|svg|png|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
