<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}} · Shipcove</title>
    <meta name="description" content="{{description}}" />
    {{alternates}}
    <link rel="icon" href="{{base}}favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body class="bg-white text-stone-800 antialiased dark:bg-stone-950 dark:text-stone-200">
    <a href="#contenu" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:rounded focus:bg-white focus:px-3 focus:py-2">{{ui.skip}}</a>
    <header class="sticky top-0 z-40 border-b border-stone-200 bg-white/90 backdrop-blur dark:border-stone-800 dark:bg-stone-950/90">
      <div class="mx-auto flex h-14 max-w-7xl items-center gap-3 px-4">
        <button type="button" class="nav-toggle -ml-1 rounded p-1.5 lg:hidden" aria-label="{{ui.menu}}" aria-expanded="false" aria-controls="sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
        <a href="{{home}}" class="flex items-center gap-2 font-semibold">
          <span class="flex h-7 w-7 items-center justify-center rounded-md bg-orange-600 font-mono text-sm text-white">π</span>
          Shipcove
        </a>
        <span class="hidden rounded-full bg-stone-100 px-2 py-0.5 text-xs text-stone-600 sm:inline dark:bg-stone-800 dark:text-stone-300">{{ui.docs}}</span>
        <span class="ml-auto">{{demo}}</span>
        <nav class="lang-switch" aria-label="{{ui.language}}">{{switcher}}</nav>
        <a href="https://github.com/Shipcove/shipcove" class="text-sm text-stone-600 hover:text-stone-900 dark:text-stone-400 dark:hover:text-white">GitHub</a>
      </div>
    </header>
    <div class="mx-auto flex max-w-7xl gap-10 px-4">
      <aside id="sidebar" class="sidebar">
        <nav aria-label="{{ui.nav}}">{{nav}}</nav>
      </aside>
      <div class="min-w-0 flex-1 py-10">
        <main id="contenu" class="prose-doc">{{content}}</main>
        {{pager}}
        <footer class="mt-16 border-t border-stone-200 pt-6 text-xs text-stone-500 dark:border-stone-800">{{ui.footer}} <a class="underline hover:text-stone-700 dark:hover:text-stone-300" href="https://github.com/Shipcove/shipcove">{{ui.source}}</a></footer>
      </div>
      <aside class="toc" aria-label="{{ui.toc}}"><p class="nav-title">{{ui.toc}}</p><ul class="toc-list"></ul></aside>
    </div>
  </body>
</html>
