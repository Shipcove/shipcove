{{- if .Values.migrations.enabled }}
# Migrations de la base avant chaque installation / mise à niveau (les services ne migrent pas au
# démarrage : DATABASE_MIGRATE_ON_START=false). Verrou consultatif côté base : sûr en parallèle.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "shipcove.fullname" . }}-migrate
  labels:
    {{- include "shipcove.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: {{- include "shipcove.selector" (dict "ctx" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- include "shipcove.podDefaults" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "shipcove.image" (dict "ctx" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "node_modules/@cap/database/dist/migrate-cli.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: api }
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
{{- end }}
