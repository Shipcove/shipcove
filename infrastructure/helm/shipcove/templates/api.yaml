{{- $name := printf "%s-api" (include "shipcove.fullname" .) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: {{- include "shipcove.labels" . | nindent 4 }}
automountServiceAccountToken: {{ eq .Values.vault.authMethod "kubernetes" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "shipcove.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{- include "shipcove.selector" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "shipcove.selector" (dict "ctx" . "component" "api" "tmp" .Values.api.tmpSize) | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      {{- include "shipcove.podDefaults" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "shipcove.image" (dict "ctx" . "name" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 3000 }
          env:
            {{- include "shipcove.commonEnv" (dict "ctx" . "component" "api" "db" "api") | nindent 12 }}
            - name: PORT
              value: "3000"
            - name: COOKIE_SECURE
              value: {{ .Values.api.cookieSecure | quote }}
            - name: TRUST_PROXY
              value: {{ .Values.api.trustProxy | quote }}
            {{- with .Values.bootstrapAdmin.existingSecret }}
            - name: BOOTSTRAP_ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: {{ . }}, key: email } }
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ . }}, key: password } }
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.api.envFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "shipcove.probes" (dict "path" "/api/v1/health/live" "port" "http") | nindent 10 }}
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
          volumeMounts: {{- include "shipcove.commonMounts" (dict "ctx" .) | nindent 12 }}
      volumes: {{- include "shipcove.commonVolumes" (dict "ctx" . "component" "api") | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "shipcove.labels" . | nindent 4 }}
spec:
  selector: {{- include "shipcove.selector" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - { name: http, port: 3000, targetPort: http }
{{- if gt (int .Values.api.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels: {{- include "shipcove.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "shipcove.selector" (dict "ctx" . "component" "api") | nindent 6 }}
{{- end }}
