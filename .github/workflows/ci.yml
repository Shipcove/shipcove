# Intégration continue : construction et publication des images Docker sur le registre GitHub
# (ghcr.io/shipcove/shipcove-*). Les tests seront ajoutés plus tard.
#  - pull request : construction des images (sans publication) ;
#  - push sur develop / main : images étiquetées par branche et par commit (sha-…) ;
#  - tag vX.Y.Z : images X.Y.Z, X.Y et latest.
name: CI

on:
  push:
    branches: [develop, main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/shipcove

jobs:
  images:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: api, context: ., file: infrastructure/docker/Dockerfile.node, target: api }
          - { image: worker, context: ., file: infrastructure/docker/Dockerfile.node, target: worker }
          - { image: gateway, context: ., file: infrastructure/docker/Dockerfile.node, target: gateway }
          - { image: preview, context: ., file: infrastructure/docker/Dockerfile.node, target: preview }
          - { image: docker-guard, context: ., file: infrastructure/docker/Dockerfile.node, target: docker-guard }
          - { image: web, context: ., file: infrastructure/docker/Dockerfile.web, target: '' }
          - { image: sandbox, context: packages/sandbox-image, file: packages/sandbox-image/Dockerfile, target: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion à ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Étiquettes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/shipcove-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=shipcove-${{ matrix.image }}
            org.opencontainers.image.vendor=Shipcove
      - name: Construction${{ github.event_name != 'pull_request' && ' et publication' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
