packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"
  - "tests/*"

# Dépendances autorisées à exécuter des scripts d'installation (liste minimale, revue).
allowBuilds:
  esbuild: true
  "@swc/core": true
  # Télémétrie de swagger-ui-dist : refusée.
  "@scarf/scarf": false
  # Accélérations natives optionnelles (dockerode via SSH, non utilisé) : refusées.
  ssh2: false
  cpu-features: false
  protobufjs: false
