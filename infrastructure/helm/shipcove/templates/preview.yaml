{{- $name := printf "%s-preview" (include "shipcove.fullname" .) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: {{- include "shipcove.labels" . | nindent 4 }}
automountServiceAccountToken: {{ eq .Values.vault.authMethod "kubernetes" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "shipcove.labels" . | nindent 4 }}
    app.kubernetes.io/component: preview
spec:
  replicas: {{ .Values.previewProxy.replicas }}
  selector:
    matchLabels: {{- include "shipcove.selector" (dict "ctx" . "component" "preview") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "shipcove.selector" (dict "ctx" . "component" "preview") | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      {{- include "shipcove.podDefaults" . | nindent 6 }}
      containers:
        - name: preview
          image: {{ include "shipcove.image" (dict "ctx" . "name" "preview") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8090 }
          env:
            {{- include "shipcove.commonEnv" (dict "ctx" . "component" "preview" "db" "gateway") | nindent 12 }}
            - name: PORT
              value: "8090"
          {{- include "shipcove.probes" (dict "path" "/__cap_health" "port" "http") | nindent 10 }}
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          resources: {{ toYaml .Values.previewProxy.resources | nindent 12 }}
          volumeMounts: {{- include "shipcove.commonMounts" (dict "ctx" .) | nindent 12 }}
      volumes: {{- include "shipcove.commonVolumes" (dict "ctx" . "component" "preview") | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "shipcove.labels" . | nindent 4 }}
spec:
  {{- if .Values.nodePorts.preview }}
  type: NodePort
  {{- end }}
  selector: {{- include "shipcove.selector" (dict "ctx" . "component" "preview") | nindent 4 }}
  ports:
    - name: http
      port: 8090
      targetPort: http
      {{- with .Values.nodePorts.preview }}
      nodePort: {{ . }}
      {{- end }}
